version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: always
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/usr/src/core
    depends_on:
      - redis
    command: bash -c "celery -A core.celery_conf.celery_app worker --loglevel=info"

volumes:
  redis_data:
